<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwipeRx Operator</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Montserrat, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e0; border-radius: 6px; }
  @keyframes njPop { 0% { transform: scale(.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes njFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  #njReset { position: fixed; right: 12px; bottom: 12px; z-index: 200; font-family: inherit; font-size: 11px; font-weight: 600;
    color: #6B7280; background: #fff; border: 1px solid #E2E8F0; border-radius: 8px; padding: 6px 11px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(16,24,40,.10); opacity: .65; }
  #njReset:hover { opacity: 1; color: #EE1B2C; border-color: #F6C9C2; }
</style>
</head>
<body>
<div id="app"></div>

<script type="text/template" id="tpl">
<div style="min-height:100vh;background:#F1F5F8;font-family:Montserrat,system-ui,sans-serif;color:#333;-webkit-font-smoothing:antialiased;">

  <!-- ============ TOP BAR ============ -->
  <div style="position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid #E2E8F0;box-shadow:0 1px 2px rgba(16,24,40,.04);">
    <div style="max-width:1240px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:22px;">
      <div style="display:flex;align-items:center;gap:11px;">
        <div style="width:34px;height:34px;border-radius:9px;background:#EE1B2C;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(238,27,44,.32);">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 8 L12 4 L19 8 L19 16 L12 20 L5 16 Z" fill="none" stroke="#fff" stroke-width="1.7"></path><circle cx="12" cy="12" r="2.4" fill="#fff"></circle></svg>
        </div>
        <div style="line-height:1.05;">
          <div style="font-weight:700;font-size:15px;letter-spacing:-.2px;">SwipeRx <span style="color:#EE1B2C;">Operator</span></div>
          <div style="font-size:10px;color:#6B7280;font-weight:500;letter-spacing:.3px;">NINJA VAN · INDONESIA</div>
        </div>
      </div>

      <div style="display:flex;gap:4px;background:#F1F5F8;padding:4px;border-radius:11px;margin-left:6px;">
        <button onClick="{{ goOperator }}" style="{{ navOperatorStyle }}">{{ T.navOperator }}</button>
        <button onClick="{{ goDriver }}" style="{{ navDriverStyle }}">{{ T.navDriver }}</button>
        <button onClick="{{ goReport }}" style="{{ navReportStyle }}">{{ T.navReport }}</button>
      </div>

      <div style="margin-left:auto;display:flex;align-items:center;gap:14px;">
        <div style="display:flex;align-items:center;gap:0;border:1px solid #E2E8F0;border-radius:9px;overflow:hidden;">
          <button onClick="{{ setID }}" style="{{ langIdStyle }}">ID</button>
          <button onClick="{{ setEN }}" style="{{ langEnStyle }}">EN</button>
        </div>
        <div style="display:flex;align-items:center;gap:8px;padding-left:4px;">
          <div style="width:30px;height:30px;border-radius:50%;background:#EEF1F4;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#6B7280;">OP</div>
          <div style="font-size:11px;color:#6B7280;line-height:1.1;">Demo Only</div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ OPERATOR ============ -->
  <sc-if value="{{ isOperator }}" hint-placeholder-val="{{ true }}">
  <div style="max-width:1240px;margin:0 auto;padding:24px 20px 60px;animation:njFade .25s ease;">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px;gap:16px;flex-wrap:wrap;">
      <div>
        <h1 style="margin:0;font-size:23px;font-weight:700;letter-spacing:-.4px;">Dashboard</h1>
        
      </div>
    </div>

    <div style="display:flex;gap:6px;border-bottom:1px solid #E2E8F0;margin-bottom:22px;flex-wrap:wrap;">
      <button onClick="{{ tabCreate }}" style="{{ tabCreateStyle }}">{{ T.tabCreate }}</button>
      <button onClick="{{ tabRdo }}" style="{{ tabRdoStyle }}">{{ T.tabRdo }} <span style="{{ rdoBadgeStyle }}">{{ rdoQueueCount }}</span></button>
      <button onClick="{{ tabUpload }}" style="{{ tabUploadStyle }}">{{ T.tabUpload }}</button>
      <button onClick="{{ tabOrders }}" style="{{ tabOrdersStyle }}">{{ T.tabOrders }}</button>
    </div>

    <!-- ---- A1 ORDER CREATION ---- -->
    <sc-if value="{{ onCreate }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:1.15fr .85fr;gap:20px;align-items:start;">
      <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:22px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
          <h3 style="margin:0;font-size:15px;font-weight:700;">{{ T.csvUpload }}</h3>
          <div style="display:flex;gap:8px;">
            <button onClick="{{ downloadTemplate }}" style="font-family:inherit;font-size:12px;font-weight:600;color:#EE1B2C;background:#FEECEE;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;">{{ T.downloadTemplate }}</button>
          </div>
        </div>

        <div onClick="{{ loadSampleCsv }}" style="{{ dropZoneStyle }}">
          <svg viewBox="0 0 24 24" width="34" height="34" style="margin-bottom:10px;"><path d="M12 16V4M12 4l-4 4M12 4l4 4" stroke="#EE1B2C" stroke-width="1.6" fill="none" stroke-linecap="round"></path><path d="M4 16v3a1 1 0 001 1h14a1 1 0 001-1v-3" stroke="#9aa5b1" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
          <div style="font-weight:600;font-size:14px;margin-bottom:4px;">{{ T.dropHere }}</div>
          <div style="font-size:12px;color:#6B7280;margin-bottom:12px;">{{ T.dropHint }}</div>
          <div style="display:inline-flex;align-items:center;gap:7px;background:#EE1B2C;color:#fff;font-weight:600;font-size:12.5px;padding:9px 16px;border-radius:9px;box-shadow:0 3px 9px rgba(238,27,44,.28);">
            {{ T.useSample }}
          </div>
          <div style="font-size:11px;color:#9aa5b1;margin-top:10px;">{{ T.sampleNote }}</div>
        </div>

        <sc-if value="{{ csvDone }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:18px;animation:njFade .3s ease;">
          <div style="display:flex;gap:10px;margin-bottom:14px;">
            <div style="flex:1;background:#EAF7EF;border:1px solid #BBE7CC;border-radius:10px;padding:11px 13px;">
              <div style="font-size:21px;font-weight:700;color:#1F9D57;">{{ csvValidCount }}</div>
              <div style="font-size:11px;color:#1F9D57;font-weight:600;">{{ T.rowsCommitted }}</div>
            </div>
            <div style="flex:1;background:#FDEEEC;border:1px solid #F6C9C2;border-radius:10px;padding:11px 13px;">
              <div style="font-size:21px;font-weight:700;color:#D11A2A;">{{ csvErrorCount }}</div>
              <div style="font-size:11px;color:#D11A2A;font-weight:600;">{{ T.rowsErrored }}</div>
            </div>
            <div style="flex:1.4;background:#F1F5F8;border:1px solid #E2E8F0;border-radius:10px;padding:11px 13px;">
              <div style="font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px;">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="#6B7280" stroke-width="1.5"></path><path d="M14 3v5h5" fill="none" stroke="#6B7280" stroke-width="1.5"></path></svg>
                {{ csvFileName }}
              </div>
              <div style="font-size:11px;color:#6B7280;margin-top:2px;">{{ T.retainedFile }}</div>
            </div>
          </div>

          <!-- ERROR LOG -->
          <sc-if value="{{ hasErrors }}" hint-placeholder-val="{{ false }}">
          <div style="border:1px solid #F6C9C2;border-radius:10px;overflow:hidden;margin-bottom:14px;">
            <div style="background:#FDEEEC;padding:9px 13px;font-size:12px;font-weight:700;color:#D11A2A;display:flex;align-items:center;gap:7px;">
              <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 8v5M12 16.5v.01M10.3 3.9 2.6 17.5A1.5 1.5 0 004 19.8h16a1.5 1.5 0 001.3-2.3L13.7 3.9a1.5 1.5 0 00-2.6 0z" fill="none" stroke="#D11A2A" stroke-width="1.5"></path></svg>
              {{ T.errorLog }}
            </div>
            <sc-for list="{{ errorRows }}" as="er" hint-placeholder-count="2">
              <div style="display:flex;gap:12px;padding:9px 13px;border-top:1px solid #F6C9C2;font-size:12px;align-items:center;">
                <code style="font-family:ui-monospace,monospace;color:#6B7280;min-width:90px;font-size:11.5px;">{{ er.awb }}</code>
                <span style="color:#D11A2A;font-weight:600;">{{ er.reason }}</span>
                <code style="margin-left:auto;font-family:ui-monospace,monospace;font-size:10.5px;color:#9aa5b1;">{{ er.raw }}</code>
              </div>
            </sc-for>
          </div>
          </sc-if>

          <button onClick="{{ tabOrdersFromCreate }}" style="font-family:inherit;width:100%;background:#fff;border:1px solid #E2E8F0;color:#333;font-weight:600;font-size:13px;padding:11px;border-radius:9px;cursor:pointer;">{{ T.viewInOrders }}</button>
        </div>
        </sc-if>
      </div>

      <!-- manual entry + creation log -->
      <div style="display:flex;flex-direction:column;gap:18px;">
        <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px;">
          <h3 style="margin:0 0 4px;font-size:14px;font-weight:700;">{{ T.manualEntry }}</h3>
          <p style="margin:0 0 13px;font-size:11.5px;color:#6B7280;">{{ T.manualHint }}</p>
          <div style="display:flex;flex-direction:column;gap:9px;">
            <input data-k="mAwb" value="{{ mAwb }}" onInput="{{ onMAwb }}" placeholder="AWB" style="font-family:inherit;border:1px solid #E2E8F0;border-radius:8px;padding:9px 11px;font-size:13px;outline:none;">
            <input data-k="mPharmacy" value="{{ mPharmacy }}" onInput="{{ onMPharmacy }}" placeholder="{{ T.pharmacy }}" style="font-family:inherit;border:1px solid #E2E8F0;border-radius:8px;padding:9px 11px;font-size:13px;outline:none;">
            <div style="display:flex;gap:9px;">
              <input data-k="mHub" value="{{ mHub }}" onInput="{{ onMHub }}" placeholder="HUB (BKS01)" style="font-family:inherit;flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:9px 11px;font-size:13px;outline:none;">
              <select data-k="mType" onChange="{{ onMType }}" style="font-family:inherit;flex:1;border:1px solid #E2E8F0;border-radius:8px;padding:9px 11px;font-size:13px;outline:none;background:#fff;">
                <option value="manual">SP Manual</option><option value="electronic">SP Electronic</option>
              </select>
            </div>
            <button onClick="{{ createOne }}" style="font-family:inherit;background:#fff;border:1.5px solid #EE1B2C;color:#EE1B2C;font-weight:600;font-size:13px;padding:9px;border-radius:9px;cursor:pointer;">{{ T.createOne }}</button>
            <sc-if value="{{ manualMsg }}" hint-placeholder-val="{{ false }}">
            <div style="{{ manualMsgStyle }}">{{ manualMsg }}</div>
            </sc-if>
          </div>
        </div>

        <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:20px;">
          <h3 style="margin:0 0 12px;font-size:14px;font-weight:700;">{{ T.creationLog }}</h3>
          <sc-for list="{{ creationLog }}" as="cl" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #F1F5F8;">
              <div style="width:32px;height:32px;border-radius:8px;background:#FEECEE;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <svg viewBox="0 0 24 24" width="15" height="15"><path d="M7 3h7l5 5v13H7z" fill="none" stroke="#EE1B2C" stroke-width="1.5"></path></svg>
              </div>
              <div style="min-width:0;">
                <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ cl.file }}</div>
                <div style="font-size:11px;color:#6B7280;">{{ cl.meta }}</div>
              </div>
            </div>
          </sc-for>
          <button onClick="{{ downloadLinks }}" style="{{ downloadLinksStyle }}">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M10 13a5 5 0 007 0l2-2a5 5 0 00-7-7l-1 1M14 11a5 5 0 00-7 0l-2 2a5 5 0 007 7l1-1" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"></path></svg>
            {{ T.downloadLinks }}
          </button>
        </div>
      </div>
    </div>

    <!-- LINKS TABLE -->
    <sc-if value="{{ csvDone }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;margin-top:20px;overflow:hidden;animation:njFade .3s ease;">
      <div style="padding:15px 20px;border-bottom:1px solid #E2E8F0;display:flex;align-items:center;justify-content:space-between;">
        <h3 style="margin:0;font-size:14px;font-weight:700;">{{ T.driverLinks }}</h3>
        <span style="font-size:11.5px;color:#6B7280;">{{ T.linksHint }}</span>
      </div>
      <div style="overflow-x:auto;">
      <table style="width:100%;border-collapse:collapse;font-size:12.5px;min-width:760px;">
        <thead><tr style="background:#F8FAFC;">
          <th style="{{ thStyle }}">AWB</th>
          <th style="{{ thStyle }}">{{ T.driverLink }}</th>
          <th style="{{ thStyle }}">{{ T.pharmacy }}</th>
          <th style="{{ thStyle }}">HUB</th>
          <th style="{{ thStyle }}">{{ T.destArea }}</th>
          <th style="{{ thStyle }}">{{ T.status }}</th>
          <th style="{{ thStyle }}"></th>
        </tr></thead>
        <tbody data-for="linkRows" data-as="r">
          <tr style="border-top:1px solid #F1F5F8;">
            <td style="{{ tdStyle }}"><code style="font-family:ui-monospace,monospace;font-weight:600;">{{ r.awb }}</code></td>
            <td style="{{ tdStyle }}"><code style="font-family:ui-monospace,monospace;color:#EE1B2C;font-weight:600;background:#FEECEE;padding:3px 8px;border-radius:6px;">{{ r.link }}</code></td>
            <td style="{{ tdStyle }}">{{ r.pharmacy }}</td>
            <td style="{{ tdStyle }}"><span style="font-family:ui-monospace,monospace;font-weight:600;">{{ r.hub }}</span></td>
            <td style="{{ tdStyle }}">{{ r.dest }}</td>
            <td style="{{ tdStyle }}"><span style="{{ r.stStyle }}">{{ r.stLabel }}</span></td>
            <td style="{{ tdStyle }}"><button onClick="{{ r.open }}" style="font-family:inherit;font-size:11.5px;font-weight:600;color:#EE1B2C;background:none;border:1px solid #F6C9C2;padding:5px 11px;border-radius:7px;cursor:pointer;">{{ T.openLink }}</button></td>
          </tr>
        </tbody>
      </table>
      </div>
    </div>
    </sc-if>
    </sc-if>

    <!-- ---- A2 RDO VALIDATION ---- -->
    <sc-if value="{{ onRdo }}" hint-placeholder-val="{{ false }}">
    <div style="display:grid;grid-template-columns:.95fr 1.05fr;gap:20px;align-items:start;">
      <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;">
        <div style="padding:15px 18px;border-bottom:1px solid #E2E8F0;">
          <h3 style="margin:0 0 11px;font-size:14px;font-weight:700;">{{ T.validationQueue }}</h3>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <div style="display:flex;align-items:center;gap:6px;border:1px solid #E2E8F0;border-radius:8px;padding:6px 9px;font-size:11.5px;color:#6B7280;">
              <svg viewBox="0 0 24 24" width="13" height="13"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="#9aa5b1" stroke-width="1.5"></rect><path d="M3 9h18M8 3v4M16 3v4" stroke="#9aa5b1" stroke-width="1.5"></path></svg>
              01/03/2026 – 12/03/2026
            </div>
            <select style="font-family:inherit;border:1px solid #E2E8F0;border-radius:8px;padding:6px 9px;font-size:11.5px;color:#333;background:#fff;">
              <option>{{ T.allStatus }}</option><option>Pending Validation</option><option>Validated</option>
            </select>
          </div>
        </div>
        <sc-for list="{{ rdoQueue }}" as="q" hint-placeholder-count="3">
          <div onClick="{{ q.select }}" style="{{ q.rowStyle }}">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
              <code style="font-family:ui-monospace,monospace;font-weight:700;font-size:13px;">{{ q.awb }}</code>
              <span style="{{ q.retStyle }}">{{ q.retLabel }}</span>
            </div>
            <div style="font-size:11.5px;color:#6B7280;margin-bottom:7px;">{{ q.pharmacy }} · {{ q.hub }}</div>
            <span style="{{ q.stStyle }}">{{ q.stLabel }}</span>
          </div>
        </sc-for>
      </div>

      <!-- detail -->
      <div style="background:#fff;border:1px solid #E2E8F0;border-radius:14px;padding:22px;">
        <sc-if value="{{ rdoSelected }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
          <code style="font-family:ui-monospace,monospace;font-size:18px;font-weight:700;">{{ sel.awb }}</code>
          <span style="{{ sel.stStyle }}">{{ sel.stLabel }}</span>
        </div>
        <div style="font-size:12.5px;color:#6B7280;margin-bottom:16px;">{{ sel.pharmacy }} · {{ sel.hub }} · {{ sel.dest }}</div>

        <div style="font-size:11.5px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:9px;">{{ T.rdoGallery }}</div>
        <div style="display:flex;gap:10px;margin-bottom:18px;">
          <sc-for list="{{ sel.docs }}" as="d" hint-placeholder-count="3">
            <div style="flex:1;">
              <div style="aspect-ratio:3/4;border:1px solid #E2E8F0;border-radius:9px;overflow:hidden;background:#F8FAFC;position:relative;">
                <img ref="{{ d.imgRef }}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:top;">
                <div style="position:absolute;bottom:0;left:0;right:0;background:rgba(31,157,87,.92);color:#fff;font-size:9.5px;font-weight:700;padding:3px 6px;display:flex;align-items:center;gap:4px;">
                  <svg viewBox="0 0 24 24" width="10" height="10"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                  {{ d.attestLabel }}
                </div>
              </div>
              <div style="font-size:10.5px;font-weight:600;text-align:center;margin-top:5px;">{{ d.name }}</div>
            </div>
          </sc-for>
        </div>

        <!-- return completeness -->
        <sc-if value="{{ sel.isReturn }}" hint-placeholder-val="{{ false }}">
        <div style="background:#FFF8EC;border:1px solid #F5E2B8;border-radius:10px;padding:13px 15px;margin-bottom:18px;">
          <div style="font-size:11.5px;font-weight:700;color:#9a6a00;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;">
            <span>{{ T.returnCompleteness }} · {{ sel.retLabel }}</span>
            <span style="{{ sel.completeStyle }}">{{ sel.completeLabel }}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            <sc-for list="{{ sel.returnChecks }}" as="rc" hint-placeholder-count="3">
              <div style="display:flex;align-items:center;gap:8px;font-size:12px;">
                <span style="{{ rc.iconStyle }}">{{ rc.icon }}</span>{{ rc.label }}
              </div>
            </sc-for>
          </div>
        </div>
        </sc-if>

        <!-- decision -->
        <sc-if value="{{ sel.pending }}" hint-placeholder-val="{{ true }}">
        <div style="border-top:1px solid #F1F5F8;padding-top:16px;">
          <div style="font-size:11.5px;font-weight:700;color:#6B7280;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px;">{{ T.decision }}</div>
          <div style="display:flex;gap:10px;margin-bottom:13px;">
            <button onClick="{{ markValid }}" style="flex:1;font-family:inherit;background:#1F9D57;color:#fff;border:none;font-weight:700;font-size:13.5px;padding:12px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{ T.valid }}
            </button>
            <button onClick="{{ toggleInvalid }}" style="{{ invalidBtnStyle }}">
              <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"></path></svg>{{ T.invalid }}
            </button>
          </div>
          <sc-if value="{{ showInvalidPanel }}" hint-placeholder-val="{{ false }}">
          <div style="background:#FDEEEC;border:1px solid #F6C9C2;border-radius:10px;padding:13px;animation:njFade .2s ease;">
            <div style="font-size:11.5px;font-weight:700;color:#D11A2A;margin-bottom:3px;">{{ T.perDocReason }}</div>
            <div style="font-size:11px;color:#b03;margin-bottom:11px;">{{ T.perDocReasonHint }}</div>
            <sc-for list="{{ sel.invalidDocRows }}" as="ir" hint-placeholder-count="3">
              <div style="background:#fff;border:1px solid #F6C9C2;border-radius:9px;padding:10px 11px;margin-bottom:8px;">
                <div style="font-size:12.5px;font-weight:700;margin-bottom:8px;">{{ ir.name }}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                  <button onClick="{{ ir.pickNone }}" style="{{ ir.noneStyle }}">{{ T.reasonOk }}</button>
                  <button onClick="{{ ir.pickHilang }}" style="{{ ir.hilangStyle }}">{{ T.reasonHilang }}</button>
                  <button onClick="{{ ir.pickCap }}" style="{{ ir.capStyle }}">{{ T.reasonCap }}</button>
                </div>
              </div>
            </sc-for>
            <button onClick="{{ confirmInvalid }}" style="{{ lockInvalidStyle }}">{{ lockInvalidLabel }}</button>
          </div>
          </sc-if>
        </div>
        </sc-if>

        <!-- resolved status -->
        <sc-if value="{{ sel.resolved }}" hint-placeholder-val="{{ false }}">
        <div style="{{ sel.resolvedBoxStyle }}">

      const a = document.createElement('a');
      a.href = url; a.download = name; document.body.appendChild(a); a.click();

  dummyPhoto(kind, text) {

    const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='160' height='120'>"
      + "<rect width='160' height='120' fill='" + c[1] + "'/>"

    const order = { awb, pharmacy, hub, dest: this.HUBS[hub], type, status: 'created', validation: null, returnType: null, returnComplete: null, returnAwb: '', rdoCompleted: false, token: awb.slice(-4) + 'MAN', date: '12/03/2026', koli: 1, po: '2603-' + awb.slice(-3), items: this.state.orders[0].items };

    const o = this.state.orders.find(x => x.token === token);

    if (this.state.driver && this.state.driver.token === token) { this.setState({ surface: 'driver' }); return; }
    const d = this.driverDocsFor(o.type);

      surface: 'driver',

  stepItem(name, delta, max) { this.setState(s => { const sel = Object.assign({}, s.driver.selected); const cur = sel[name] || 0; let next = cur + delta; if (next < 0) next = 0; if (next > max) next = max; sel[name] = next; return { driver: Object.assign({}, s.driver, { selected: sel }) }; }); }

    // commit to data: mark delivered/pending + push returns
    const d = this.state.driver;
    const orders = this.state.orders.map(o => {
      if (o.awb !== d.awb) return o;
      const upd = Object.assign({}, o, { status: 'pending' });

      if (d.returnMode === 'semua') { upd.returnType = 'semua'; upd.returnComplete = true; upd.returnAwb = 'RTS-' + o.awb.slice(3); }
      return upd;
    });
    let returns = this.state.returns.slice();
    const o = this.state.orders.find(x => x.awb === d.awb);
    if (d.returnMode === 'sebagian') {
      const rAwb = 'RTS-' + d.awb.slice(3);
      Object.keys(d.selected).filter(k => d.selected[k] > 0).forEach(name => {
        returns.push({ date: '12/03/2026', hub: o.hub, pharmacy: o.pharmacy, origAwb: o.awb, returnAwb: rAwb, item: name, qty: d.selected[name], validation: 'pending', complete: true, returnType: 'sebagian' });

      vals.stickerIconColor = d.sticker ? '#9aa5b1' : '#cbd5e0';
      vals.stickerBtnLabel = d.sticker ? (this.L('Foto tersimpan ✓', 'Photo saved ✓')) : (this.L('Ambil foto', 'Capture'));
      vals.stickerBtnStyle = `font-family:inherit;border:1.5px solid ${d.sticker ? '#1F9D57' : '#EE1B2C'};background:${d.sticker ? '#EAF7EF' : '#fff'};color:${d.sticker ? '#1F9D57' : '#EE1B2C'};font-weight:700;font-size:13px;padding:10px 20px;border-radius:9px;cursor:pointer;`;
      vals.stickerToBa = () => this.stickerToBa();
      vals.stickerNextStyle = `font-family:inherit;width:100%;margin-top:14px;border:none;font-weight:700;font-size:14px;padding:14px;border-radius:12px;background:${d.sticker ? '#EE1B2C' : '#F1F5F8'};color:${d.sticker ? '#fff' : '#9aa5b1'};cursor:${d.sticker ? 'pointer' : 'not-allowed'};`;
      // ba

      vals.baThumbStyle = `width:120px;height:120px;border-radius:14px;border:1px solid ${d.ba ? '#cbd5e0' : '#E2E8F0'};background:${d.ba ? '#EEF1F4' : '#F8FAFC'};display:flex;align-items:center;justify-content:center;margin:0 auto 14px;`;
      vals.baIconColor = d.ba ? '#9aa5b1' : '#cbd5e0';
      vals.baBtnLabel = d.ba ? (this.L('Foto tersimpan ✓', 'Photo saved ✓')) : (this.L('Ambil foto', 'Capture'));
      vals.baBtnStyle = `font-family:inherit;border:1.5px solid ${d.ba ? '#1F9D57' : '#EE1B2C'};background:${d.ba ? '#EAF7EF' : '#fff'};color:${d.ba ? '#1F9D57' : '#EE1B2C'};font-weight:700;font-size:13px;padding:10px 20px;border-radius:9px;cursor:pointer;`;
      vals.baToSummary = () => this.baToSummary();
      vals.baNextStyle = `font-family:inherit;width:100%;margin-top:14px;border:none;font-weight:700;font-size:14px;padding:14px;border-radius:12px;background:${d.ba ? '#EE1B2C' : '#F1F5F8'};color:${d.ba ? '#fff' : '#9aa5b1'};cursor:${d.ba ? 'pointer' : 'not-allowed'};`;
      // summary
      vals.summaryDocs = d.docs.order.map(k => ({ name: d.docs.map[k].name }));
      vals.summaryHasReturn = !!d.returnMode;
      vals.summaryRetStyle = this.retMeta(d.returnMode).s; vals.summaryRetLabel = this.retMeta(d.returnMode).l;
      if (d.returnMode === 'sebagian') vals.summaryReturns = selNames.map(n => ({ name: n, qty: d.selected[n] }));
      else if (d.returnMode === 'semua') vals.summaryReturns = [{ name: this.L('Seluruh parcel dikembalikan', 'All parcels returned'), qty: o.items.length }];
      else vals.summaryReturns = [];
      vals.finishSuccess = () => this.finishSuccess();
      vals.backToOps = () => this.backToOps();
    } else {
      vals.dD1 = false; vals.dType = false; vals.dCapture = false; vals.dPost = false; vals.dRetSelect = false;
      vals.dRetItemPhotos = false; vals.dRetOverall = false; vals.dSticker = false; vals.dBa = false; vals.dSummary = false; vals.dSuccess = false;
      vals.driverLinkLabel = '';
      vals.dOrder = { stStyle: '', stLabel: '', items: [] };
    }

    // example modal
    if (st.showExample && d) {
      const conf = this.exampleConf(st.exampleSlot, d.order.type);
      vals.showExample = true;
      vals.exampleImg = conf.img; vals.exampleImgRef = (n) => { if (n && n.getAttribute('src') !== conf.img) n.setAttribute('src', conf.img); }; vals.exampleBoxStyle = this.boxStyle(conf.box);
      vals.exampleTitle = conf.title; vals.exampleCaption = conf.cap; vals.exampleHint = conf.hint;
    } else {
      vals.showExample = false;
      const fallback = 'uploads/1. Faktur SP Manual.png';
      vals.exampleImg = fallback; vals.exampleImgRef = (n) => { if (n && n.getAttribute('src') !== fallback) n.setAttribute('src', fallback); }; vals.exampleBoxStyle = ''; vals.exampleTitle = ''; vals.exampleCaption = ''; vals.exampleHint = '';
    }

    vals.closeExample = () => this.closeExample();
    return vals;
  }
}

// ============================== boot ==============================
(function () {
  var STORAGE_KEY = 'swiperx_operator_state_v1';
  var container = document.getElementById('app');

  // Parse the template once (HTML parser keeps SVG namespaces + real form controls).
  var tplDoc = new DOMParser().parseFromString(document.getElementById('tpl').textContent, 'text/html');
  var TPL_NODES = Array.prototype.slice.call(tplDoc.body.childNodes);

  var app = new Component({});

  // Rehydrate persisted state over the seeded defaults.
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) app.state = Object.assign({}, app.state, JSON.parse(saved));
  } catch (e) { /* ignore corrupt state */ }

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(app.state)); } catch (e) {}
  }

  function render() {
    var scope = app.renderVals();
    __handlers = {}; __hid = 0;       // fresh handler registry each render
    var built = [];
    TPL_NODES.forEach(function (n) { built = built.concat(__build(n, scope)); });
    __morph(container, built);        // patch in place — no teardown, no flicker
  }

  // Delegated event dispatch: one listener per type resolves the nearest
  // element carrying a registered handler id and invokes the current closure.
  ['click', 'input', 'change'].forEach(function (evt) {
    var attr = 'data-on' + evt;
    container.addEventListener(evt, function (e) {
      var node = e.target;
      while (node && node !== container) {
        var id = node.getAttribute && node.getAttribute(attr);
        if (id && __handlers[id]) { __handlers[id].call(null, e); return; }
        node = node.parentNode;
      }
    });
  });

  // setState -> persist + render
  __hooks.onChange = function () { persist(); render(); };

  // Driver deep-link: index.html#/d/{token} ; also #/operator and #/report
  function applyHash() {
    var h = location.hash || '';
    var m = /^#\/d\/(.+)$/.exec(h);
    if (m) { app.openDriver(decodeURIComponent(m[1])); return true; }
    if (h === '#/report') { app.setSurface('report'); return true; }
    if (h === '#/operator') { app.setSurface('operator'); return true; }
    return false;
  }
  window.addEventListener('hashchange', function () { applyHash(); });

  // Reset-to-seed control (handy for re-running the live walkthrough)
  var reset = document.createElement('button');
  reset.id = 'njReset';
  reset.textContent = 'Reset demo';
  reset.title = 'Clear saved state and reload the seeded demo';
  reset.addEventListener('click', function () {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    location.hash = '';
    location.reload();
  });
  document.body.appendChild(reset);
  window.resetDemo = function () { reset.click(); };

  // First paint
  if (!applyHash()) render();
})();
</script>
