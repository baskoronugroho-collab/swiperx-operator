# Serve the Vite build. /api is routed to the backend by the ingress, so it never
# reaches nginx here. Every other path falls back to index.html so the SPA router owns
# /orders, /returns and — critically — /c/<token>, the courier link target.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; the shell must never be cached, or couriers
    # keep loading a stale wizard after a deploy.
    #
    # They live under /c/assets/ (not /assets/) because Substrait's SSO gateway only
    # allowlists /c/* and /api/c/* — see the note in frontend/vite.config.ts. The
    # try_files below serves them as plain files; only unmatched /c/<token> paths fall
    # through to the SPA shell.
    location /c/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
