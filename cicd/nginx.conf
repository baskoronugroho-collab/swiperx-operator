# Serve the Vite build. /api is routed to the backend by the ingress, so it never
# reaches nginx here. Every other path falls back to index.html so the SPA router owns
# /orders, /returns and — critically — /c/<token>, the courier link target.
#
# Do NOT add a compose-style `location /api/ { proxy_pass http://backend:8000; }` for local
# development. nginx resolves every literal proxy_pass hostname when it LOADS this file, and
# `backend` does not exist in the app's namespace — nginx then refuses to start, the frontend
# crash-loops with `host not found in upstream "backend"`, and the app 502s. Since scaffold
# 2026.09.08 the platform rejects such a file at VALIDATING instead. For local work use
# `npm run dev` (Vite proxies /api) — see frontend/vite.config.ts.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable; the shell must never be cached, or couriers
    # keep loading a stale wizard after a deploy.
    #
    # They live under /c/assets/ (not /assets/) because Substrait's SSO gateway only
    # allowlists /c/* and /api/c/* — see the note in frontend/vite.config.ts. The
    # try_files below serves them as plain files; only unmatched /c/<token> paths fall
    # through to the SPA shell.
    location /c/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
