# Serve the static prototype. /api is routed to the backend by the ingress, so it never
# reaches nginx here. Unknown paths fall back to the landing page.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
